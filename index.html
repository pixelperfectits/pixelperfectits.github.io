<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Perfect IT Solutions | Global Systems Engineering Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Hind Siliguri', sans-serif; scroll-behavior: smooth; background-color: #000000; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.01); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; transition: all 0.4s ease; cursor: pointer; }
        .glass-card:hover { border-color: #00F2FF; transform: scale(1.02); }
        .neon-text { text-shadow: 0 0 20px rgba(0, 242, 255, 0.8); }
        /* Modal Style */
        #portfolio-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="text-slate-300">

    <!-- NAVIGATION -->
    <header class="fixed w-full z-50 bg-black/60 backdrop-blur-2xl border-b border-white/5">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="https://raw.githubusercontent.com/pixelperfectits/assets/main/Flat%20Minimal%20Neon%20Icon.png" alt="Logo" class="w-10 h-10 shadow-[0_0_20px_#00F2FF] rounded-xl">
                <span class="text-xl font-black text-white italic tracking-tighter uppercase hidden sm:block">Pixel Perfect</span>
            </div>
            <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest text-slate-400">
                <a href="#portfolio" class="hover:text-[#00F2FF]">Portfolio</a>
                <a href="/bhumitech" class="text-emerald-400 border border-emerald-400/20 px-3 py-1 rounded-full">Bhumitech</a>
            </div>
            <a href="https://wa.me/8801715354960" class="bg-[#00F2FF] text-black px-5 py-2 rounded-full font-black text-[9px] uppercase tracking-widest">WhatsApp</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="pt-48 pb-20 text-center px-6">
        <h1 class="text-5xl md:text-8xl font-black text-white leading-none mb-8 uppercase italic tracking-tighter">
            Architectural <br><span class="text-[#00F2FF] neon-text">Excellence</span>
        </h1>
        <p class="text-slate-500 max-w-2xl mx-auto text-lg mb-12 uppercase font-bold tracking-widest leading-relaxed">
            ডিজিটাল লজিক এবং মাটির তথ্যের সমন্বয়ে নিখুঁত প্রকৌশল সমাধান।
        </p>
    </section>

    <!-- DYNAMIC SHOWCASE (NO GITHUB LINK VISIBLE) -->
    <section id="portfolio" class="py-20">
        <div class="container mx-auto px-6">
            <h2 class="text-3xl font-black text-white uppercase italic tracking-tighter mb-16 text-center border-b border-white/5 pb-6">The Private Vault</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                
                <!-- Item 1 -->
                <div class="glass-card p-4 group" onclick="openModal('https://raw.githubusercontent.com/pixelperfectits/assets/main/Flat%20Minimal%20Neon%20Icon.png', 'Global Brand Identity', 'Strategic design for high-tech enterprises.')">
                    <div class="aspect-square bg-slate-900 rounded-2xl overflow-hidden mb-6">
                        <img src="https://raw.githubusercontent.com/pixelperfectits/assets/main/Flat%20Minimal%20Neon%20Icon.png" class="w-full h-full object-cover opacity-50 group-hover:opacity-100 transition duration-700">
                    </div>
                    <h4 class="text-white font-black text-xs uppercase tracking-widest mb-1">Visual Branding</h4>
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Click to Inspect</p>
                </div>

                <!-- Item 2 (You can add your other 5 designs here) -->
                <div class="glass-card p-4 group" onclick="openModal('https://raw.githubusercontent.com/pixelperfectits/assets/main/3D%20Glass%20Orb%20Logo.png', '3D Asset Engineering', 'High-fidelity visual assets for web and apps.')">
                    <div class="aspect-square bg-slate-900 rounded-2xl overflow-hidden mb-6">
                        <img src="https://raw.githubusercontent.com/pixelperfectits/assets/main/3D%20Glass%20Orb%20Logo.png" class="w-full h-full object-cover opacity-50 group-hover:opacity-100 transition duration-700">
                    </div>
                    <h4 class="text-white font-black text-xs uppercase tracking-widest mb-1">3D Systems</h4>
                    <p class="text-[9px] text-slate-500 font-bold uppercase">Click to Inspect</p>
                </div>

                <!-- Repeat for other items... -->

            </div>
        </div>
    </section>

    <!-- PORTFOLIO MODAL (THE HIDDEN OVERLAY) -->
    <div id="portfolio-modal" onclick="closeModal()">
        <div class="max-w-4xl w-full glass-card p-6 bg-black border border-white/10" onclick="event.stopPropagation()">
            <img id="modal-img" src="" class="w-full rounded-2xl mb-8 border border-white/5 shadow-2xl">
            <h3 id="modal-title" class="text-2xl font-black text-white uppercase italic mb-2"></h3>
            <p id="modal-desc" class="text-slate-400 text-sm mb-8"></p>
            <div class="flex gap-4">
                <a href="https://wa.me/8801715354960" class="bg-[#00F2FF] text-black px-8 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">Purchase This Service</a>
                <button onclick="closeModal()" class="text-slate-500 font-bold uppercase text-[10px] hover:text-white">Close</button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="py-20 border-t border-white/5 text-center">
        <p class="text-[10px] font-black text-slate-600 uppercase tracking-[0.5em]">© 2024 Pixel Perfect IT Solutions</p>
    </footer>

    <script>
        lucide.createIcons();

        function openModal(imgSrc, title, desc) {
            document.getElementById('modal-img').src = imgSrc;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('portfolio-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('portfolio-modal').style.display = 'none';
        }
    </script>
</body>
</html>
